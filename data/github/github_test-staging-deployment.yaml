id: github_test-staging-deployment
version: "1.0"
name: Test Staging Deployment with Custom Parameters
stages:
  - id: deploy-to-staging
    executionMode: SEQUENTIAL
    steps:
      - id: staging-deploy-step
        type: GITHUB_WORKFLOW
        config:
          repo: alaudmins/demo-calc-app
          workflow: build-deploy.yml
          branch: main
          token: "secret:github-token"
          inputs:
            environment: "staging"
            version: "2.5.3"
            enable_tests: true
            notes: "Triggered by pt-orchestrator for staging validation"
