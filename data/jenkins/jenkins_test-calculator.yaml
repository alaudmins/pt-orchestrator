id: jenkins_test-calculator
version: "1.0"
name: Test Jenkins Calculator Pipeline Integration
stages:
  - id: trigger-jenkins-job
    executionMode: SEQUENTIAL
    steps:
      - id: run-calculator-pipeline
        type: JENKINS_JOB
        config:
          jenkinsUrl: "${JENKINS_URL:http://localhost:9090}"
          jobName: "calculator-pipeline"
          username: "${JENKINS_USER:pt-orch}"
          token: "secret:jenkins-token"
          parameters:
            OPERATION: "MULTIPLY"
            NUM1: "15"
            NUM2: "7"
            VERBOSE: "true"

      - id: wait-for-warmup
        type: WAIT
        config:
          durationSeconds: 10

      - id: verify-success
        type: JENKINS_JOB
        config:
          jenkinsUrl: "${JENKINS_URL:http://localhost:9090}"
          jobName: "calculator-pipeline"
          username: "${JENKINS_USER:pt-orch}"
          token: "secret:jenkins-token"
          parameters:
            OPERATION: "ADD"
            NUM1: "100"
            NUM2: "50"
            VERBOSE: "true"
