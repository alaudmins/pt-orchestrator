version: '3.8'

services:
  # PostgreSQL database (optional - can be disabled if using external DB)
  orchestrator-db:
    image: postgres:15
    container_name: orchestrator-db
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - with-db  # Only start this service when 'with-db' profile is active

  orchestrator-app:
    build: .
    container_name: orchestrator-app
    ports:
      - "8080:8080"
    environment:
      # Database configuration - override these to use external database
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:postgresql://orchestrator-db:5432/orchestrator}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      
      # Application credentials
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:9090}
      JENKINS_USER: ${JENKINS_USER:-pt-orch}
      JENKINS_TOKEN: ${JENKINS_TOKEN}
    depends_on:
      orchestrator-db:
        condition: service_healthy
        required: false  # Make database dependency optional
