# ============================================================
# pt-orchestrator - Common Application Configuration
# ============================================================
# Database type is controlled by the active Spring profile:
#
#   H2 in-memory (default, no installation needed):
#     spring.profiles.active=h2
#
#   PostgreSQL (for production/staging):
#     spring.profiles.active=postgres
#
# Set via environment variable:
#   export SPRING_PROFILES_ACTIVE=postgres
# Or as a JVM argument:
#   java -jar pt-orchestrator.jar --spring.profiles.active=postgres
# ============================================================

# Default active profile: H2 in-memory DB (no external DB required)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# ---- JPA Common Settings ----
spring.jpa.show-sql=false

# ---- Server ----
server.port=8080

# ---- Task Poller ----
orchestrator.poller.interval=10000
orchestrator.poller.initial-delay=5000

# ---- Workflow Async Executor thread pool ----
# corePoolSize  = always-on threads (= max expected concurrent workflow runs)
# maxPoolSize   = burst ceiling
# queueCapacity = pending trigger backlog before rejecting
orchestrator.executor.core-pool-size=5
orchestrator.executor.max-pool-size=20
orchestrator.executor.queue-capacity=100

# ---- Secrets ----
# Bridge: maps SECRETS_ENCRYPTION_KEY (from .env or system env) to the
# property that EncryptionService reads via @Value.
# spring-dotenv loads .env automatically, so this works from IntelliJ,
# mvn spring-boot:run, java -jar, and Docker without any extra config.
orchestrator.secrets.encryption-key=${SECRETS_ENCRYPTION_KEY:}

# ---- Jenkins / GitHub (convenience bridge for EnvVarResolver) ----
# These are already resolved dynamically at step execution time via
# EnvVarResolver.  Listed here so they are visible in Swagger/actuator env.
JENKINS_URL=${JENKINS_URL:}
JENKINS_USER=${JENKINS_USER:}

