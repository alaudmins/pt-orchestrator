# ============================================================
# pt-orchestrator - Common Application Configuration
# ============================================================
# Database type is controlled by the active Spring profile:
#
#   H2 in-memory (default, no installation needed):
#     spring.profiles.active=h2
#
#   PostgreSQL (for production/staging):
#     spring.profiles.active=postgres
#
# Set via environment variable:
#   export SPRING_PROFILES_ACTIVE=postgres
# Or as a JVM argument:
#   java -jar pt-orchestrator.jar --spring.profiles.active=postgres
# ============================================================

# Default active profile: H2 in-memory DB (no external DB required)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# ---- JPA Common Settings ----
spring.jpa.show-sql=false

# ---- Server ----
server.port=8080

# ---- Task Poller ----
orchestrator.poller.interval=10000
orchestrator.poller.initial-delay=5000
