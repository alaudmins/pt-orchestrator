# ============================================================
# H2 File-Based Database Profile
# Active with: --spring.profiles.active=h2
# ============================================================
# Data is stored in ./data/orchestratordb (relative to working directory).
# When running in Docker, mount a volume at /app/data to persist data
# across container restarts.

# Datasource - File-based H2 (persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/orchestratordb;AUTO_SERVER=TRUE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Web Console (available at http://localhost:8080/h2-console)
# web-allow-others=true is required to access the console from outside the container
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
