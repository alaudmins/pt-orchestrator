# ============================================================
# PostgreSQL Database Profile
# Active with: --spring.profiles.active=postgres
# Or via env: SPRING_PROFILES_ACTIVE=postgres
# ============================================================

# Datasource - reads from environment variables for security
# Defaults fall back to local dev values if env vars are not set
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/orchestrator}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
