id: jenkins_test-calculator
version: "1.0"
name: Test Jenkins Calculator Pipeline Integration
stages:
  - id: trigger-jenkins-job
    executionMode: SEQUENTIAL
    steps:
      - id: run-calculator-pipeline
        type: JENKINS_JOB
        config:
          jenkinsUrl: "http://localhost:9090"
          jobName: "calculator-pipeline"
          username: "pt-orch"
          token: "1116dba6516c82d4d59aa042d0e32473c2"
          parameters:
            OPERATION: "MULTIPLY"
            NUM1: "15"
            NUM2: "7"
            VERBOSE: "true"

      - id: verify-success
        type: JENKINS_JOB
        config:
          jenkinsUrl: "http://localhost:9090"
          jobName: "calculator-pipeline"
          username: "pt-orch"
          token: "1116dba6516c82d4d59aa042d0e32473c2"
          parameters:
            OPERATION: "ADD"
            NUM1: "100"
            NUM2: "50"
            VERBOSE: "true"
